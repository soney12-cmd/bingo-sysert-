* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #ffffff;
  font-family: 'RoyalTheatreSans', sans-serif;
  min-height: 100vh;
  padding: 0 0 40px;
}

.hero {
  background: #1A5CFF;
  padding: 28px 20px 24px;
  position: relative;
  overflow: hidden;
}

.hero-label {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 6px;
}

.hero-title {
  font-family: 'RoyalTheatreSerif', serif;
  font-size: 52px;
  line-height: 0.95;
  color: #fff;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.hero-sub {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 13px;
  opacity: 0.85;
  line-height: 1.5;
  margin-top: 10px;
  max-width: 280px;
}

.logo-1732 {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'RoyalTheatreSerif', serif;
  font-size: 80px;
  color: rgba(255,255,255,0.15);
  line-height: 1;
  user-select: none;
}

.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  margin: 2px 0;
}

.stat {
  background: #141414;
  padding: 14px 16px;
  text-align: center;
}

.stat-val {
  font-family: 'RoyalTheatreSerif', serif;
  font-size: 40px;
  color: #1A5CFF;
  display: block;
  line-height: 1;
}

.stat-lbl {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 3px;
  display: block;
}

.msg-bar {
  background: #141414;
  text-align: center;
  padding: 10px 16px;
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 13px;
  color: #555;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
}

.msg-bar.win {
  background: #1A5CFF;
  color: #fff;
  font-size: 14px;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  margin-bottom: 2px;
}

.tab {
  background: #141414;
  border: none;
  color: #555;
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px;
  cursor: pointer;
}

.tab.active {
  background: #fff;
  color: #0a0a0a;
}

.section { display: none; }
.section.active { display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  background: #0a0a0a;
}

.cell {
  aspect-ratio: 1;
  background: #141414;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 4px 3px;
  text-align: center;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}

.cell.done { background: #1A5CFF; }
.cell.free { background: #fff; cursor: default; }

.cell-icon {
  font-size: 20px;
  line-height: 1;
  margin-bottom: 3px;
  display: block;
  font-style: normal;
}

.cell-text {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 9px;
  line-height: 1.25;
  color: #666;
  display: block;
}

.cell.done .cell-text { color: rgba(255,255,255,0.9); }
.cell.free .cell-text { color: #0a0a0a; font-size: 9px; }

.cell-check {
  position: absolute;
  top: 3px;
  right: 4px;
  font-size: 9px;
  color: rgba(255,255,255,0.8);
  display: none;
}

.cell.done .cell-check { display: block; }

.list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.list-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: #141414;
  padding: 13px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-left: 3px solid transparent;
}

.list-item.done {
  background: #0d1f5c;
  border-left-color: #1A5CFF;
}

.list-item.free {
  background: #fff;
  cursor: default;
  border-left-color: #1A5CFF;
}

.list-num {
  font-family: 'RoyalTheatreSerif', serif;
  font-size: 20px;
  color: #333;
  min-width: 24px;
  line-height: 1;
  padding-top: 1px;
}

.list-item.done .list-num { color: #1A5CFF; }
.list-item.free .list-num { color: #0a0a0a; }

.list-body { flex: 1; }

.list-text {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 14px;
  line-height: 1.4;
  color: #ccc;
  margin-bottom: 3px;
}

.list-item.done .list-text { color: #fff; }
.list-item.free .list-text { color: #0a0a0a; }

.list-tag {
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 10px;
  color: #444;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.list-item.done .list-tag { color: #4d7fff; }
.list-item.free .list-tag { color: #1A5CFF; }

.list-check {
  font-size: 18px;
  color: #1A5CFF;
  display: none;
  align-self: center;
  flex-shrink: 0;
}

.list-item.done .list-check { display: block; }

.reset-wrap { padding: 16px; margin-top: 2px; }

.reset-btn {
  width: 100%;
  background: transparent;
  border: 1.5px solid #333;
  color: #555;
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px;
  cursor: pointer;
}

.footer {
  text-align: center;
  padding: 20px 16px 0;
  font-family: 'RoyalTheatreSans', sans-serif;
  font-size: 11px;
  color: #333;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-title">Бинго<br>по<br>Сысерти</div>
  <div class="hero-sub">Гуляешь — находишь — отмечаешь. Соберёшь линию → бинго. Всё → продюсер.</div>
</div>

<div class="stats-row">
  <div class="stat">
    <span class="stat-val" id="cnt">1</span>
    <span class="stat-lbl">из 25 найдено</span>
  </div>
  <div class="stat">
    <span class="stat-val" id="lines">0</span>
    <span class="stat-lbl">линий бинго</span>
  </div>
</div>

<div class="msg-bar" id="msg">Нажми на клетку, когда найдёшь</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('grid')">Сетка</button>
  <button class="tab" onclick="switchTab('list')">Список</button>
</div>

<div class="section active" id="sec-grid">
  <div class="grid" id="grid"></div>
</div>

<div class="section" id="sec-list">
  <div class="list" id="list"></div>
</div>

<div class="reset-wrap">
  <button class="reset-btn" onclick="reset()">Начать заново</button>
</div>

<div class="footer">1732 · Сысерть · Продюсер города</div>

<script>
var cells = [
  { icon: "⚙", text: "Старый завод, ставший местом событий", tag: "Проект-драйвер" },
  { icon: "◎", text: "Кофейня в нестандартном здании", tag: "Предпринимательство" },
  { icon: "▦", text: "Арт-объект в городе", tag: "Арт-дирекшн" },
  { icon: "◉", text: "Местный, придумавший что-то для города", tag: "Пассионарий" },
  { icon: "△", text: "Заброшенное здание с потенциалом", tag: "Актив" },
  { icon: "⊕", text: "Место, которое хочется сфотографировать", tag: "Образ" },
  { icon: "◆", text: "Проект с федеральной поддержкой", tag: "Путеводная звезда" },
  { icon: "♡", text: "Что-то сделанное руками горожан", tag: "Соучастие" },
  { icon: "⊞", text: "Новый бизнес за последние 3 года", tag: "Акселерация" },
  { icon: "▣", text: "Историческое здание, которое сохранили", tag: "Наследие" },
  { icon: "◇", text: "Событие, собирающее людей из других городов", tag: "Проект-драйвер" },
  { icon: "↑", text: "Что выросло и осталось после того, как люди приехали и поработали вместе", tag: "След резиденции" },
  { free: true, text: "Сысерть — прото-продюсер", tag: "★" },
  { icon: "↗", text: "Бизнес, выросший благодаря туристам", tag: "Экономика" },
  { icon: "□", text: "Благоустроенное общественное пространство", tag: "MVP" },
  { icon: "◈", text: "Образовательный проект для местных", tag: "Акселерация" },
  { icon: "♩", text: "Культурное событие на нестандартной площадке", tag: "Арт-дирекшн" },
  { icon: "★", text: "Человек, который мог уехать, но остался", tag: "Пассионарий" },
  { icon: "○", text: "Место с активной жизнью в соцсетях", tag: "Образ" },
  { icon: "⋈", text: "Сотрудничество власти и бизнеса в одном проекте", tag: "Триада" },
  { icon: "◐", text: "Образ или слоган, отражающий дух города", tag: "Путеводная звезда" },
  { icon: "⊗", text: "Что выросло из совместной работы приезжих и местных — объект, сервис, проект", tag: "След резиденции" },
  { icon: "⊙", text: "Активное сообщество по интересам", tag: "Соучастие" },
  { icon: "◦", text: "Проект, выросший из маленькой идеи", tag: "MVP" },
  { icon: "⚑", text: "Повод для гордости, известный за пределами города", tag: "Котировки" },
];

var SIZE = 5;
var state = Array(25).fill(false);
state[12] = true;

function checkLines() {
  var lines = 0;
  for (var r = 0; r < SIZE; r++) {
    if ([0,1,2,3,4].every(function(c){ return state[r*SIZE+c]; })) lines++;
  }
  for (var c = 0; c < SIZE; c++) {
    if ([0,1,2,3,4].every(function(r){ return state[r*SIZE+c]; })) lines++;
  }
  if ([0,6,12,18,24].every(function(i){ return state[i]; })) lines++;
  if ([4,8,12,16,20].every(function(i){ return state[i]; })) lines++;
  return lines;
}

function updateStats() {
  var cnt = state.filter(Boolean).length;
  var lines = checkLines();
  document.getElementById('cnt').textContent = cnt;
  document.getElementById('lines').textContent = lines;
  var msg = document.getElementById('msg');
  if (cnt === 25) {
    msg.textContent = 'Полное бинго! Ты настоящий продюсер города.';
    msg.className = 'msg-bar win';
  } else if (lines > 0) {
    msg.textContent = 'Бинго! Собрано линий: ' + lines;
    msg.className = 'msg-bar win';
  } else {
    msg.textContent = 'Нажми на клетку, когда найдёшь';
    msg.className = 'msg-bar';
  }
}

function toggle(i) {
  state[i] = !state[i];
  renderGrid();
  renderList();
  updateStats();
}

function renderGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  cells.forEach(function(c, i) {
    var d = document.createElement('div');
    d.className = 'cell' + (state[i] ? ' done' : '') + (c.free ? ' free' : '');
    d.innerHTML = '<span class="cell-icon">' + (c.free ? '★' : c.icon) + '</span>'
      + '<span class="cell-text">' + c.text + '</span>'
      + '<span class="cell-check">✓</span>';
    if (!c.free) { (function(idx){ d.onclick = function(){ toggle(idx); }; })(i); }
    g.appendChild(d);
  });
}

function renderList() {
  var l = document.getElementById('list');
  l.innerHTML = '';
  cells.forEach(function(c, i) {
    var d = document.createElement('div');
    d.className = 'list-item' + (state[i] ? ' done' : '') + (c.free ? ' free' : '');
    d.innerHTML = '<span class="list-num">' + (i+1) + '</span>'
      + '<div class="list-body">'
      + '<div class="list-text">' + c.text + '</div>'
      + '<div class="list-tag">' + c.tag + '</div>'
      + '</div>'
      + '<span class="list-check">✓</span>';
    if (!c.free) { (function(idx){ d.onclick = function(){ toggle(idx); }; })(i); }
    l.appendChild(d);
  });
}

function switchTab(tab) {
  document.getElementById('sec-grid').className = 'section' + (tab === 'grid' ? ' active' : '');
  document.getElementById('sec-list').className = 'section' + (tab === 'list' ? ' active' : '');
  var tabs = document.querySelectorAll('.tab');
  tabs[0].className = 'tab' + (tab === 'grid' ? ' active' : '');
  tabs[1].className = 'tab' + (tab === 'list' ? ' active' : '');
}

function reset() {
  state = Array(25).fill(false);
  state[12] = true;
  renderGrid();
  renderList();
  updateStats();
}

renderGrid();
